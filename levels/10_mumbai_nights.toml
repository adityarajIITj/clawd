# ============================================================================
#  MAHARASHTRA TALES · WORLD 4 — MUMBAI NIGHTS
#  Rooftop hopping over Marine Drive. Water tanks, dish antennas, kaali-peelis.
# ============================================================================
[level]
id = 10
campaign = "manus"
name = "Mumbai Nights"
subtitle = "The city that never sleeps, seen from its rooftops"
story = "The last local has left and Marine Drive is glowing like a necklace. Up on the rooftops, between water tanks and dish antennas, the city's night lizards come out to play. Hop the kaali-peeli taxis and mind the gap."
